[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mil-km"
version = "0.1.0"
description = "Plan de 1000 km en un año (23 nov 2026 a 23 nov 2027) con sincronización desde Garmin Forerunner 255"
requires-python = ">=3.12"
dependencies = ["pyyaml>=6"]

[project.optional-dependencies]
garmin = ["garminconnect>=0.3.20"]
dev = ["pytest>=8"]

[project.scripts]
mil = "mil.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
